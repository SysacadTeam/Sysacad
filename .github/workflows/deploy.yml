name: 🚀 Deploy to Production

on:
  # Only deploy when Static Analysis passes on production
  workflow_run:
    workflows: ["🔍 Static Analysis"]
    types:
      - completed
    branches:
      - production
  # Allow manual deploy bypass (e.g. hotfix)
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    # Block deploy if analysis failed; workflow_dispatch bypasses for hotfixes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Código fuente ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy the exact commit that was analysed, not just HEAD
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── 2. Calcular nombre de imagen en minúsculas ────────────────
      - name: Set image name (lowercase)
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sysacad" >> $GITHUB_ENV

      # ── 3. Autenticación GHCR ────────────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Build multi-stage (Client + Server) y push ───────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Sysacad/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Copiar archivos de infraestructura a la VM ────────────
      - name: Copy infra files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Sysacad/docker-compose.yml,Sysacad/Caddyfile"
          target: ~/sysacad/
          strip_components: 1

      # ── 6. Deploy en la VM ────────────────────────────────────────
      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd ~/sysacad
            DOCKER_IMAGE="${IMAGE}:latest" docker compose pull sysacad
            DOCKER_IMAGE="${IMAGE}:latest" docker compose up -d --remove-orphans
            docker image prune -f
            sudo cp ~/sysacad/Caddyfile /etc/caddy/Caddyfile
            sudo systemctl reload caddy
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
